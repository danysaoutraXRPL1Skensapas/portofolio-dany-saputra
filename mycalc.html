<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./css/mycalc.css">
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>

  <div class="container mt-5" style="max-width: 350px;">
    
    <div class="text-center mb-4">
      <h2>my calculator (with ugly ui)</h2>
    </div>

    <div class="card p-3 shadow-sm">
      

      <div class="mb-3">
        <input type="text" id="display" class="form-control form-control-lg text-end fs-2" value="0" readonly>
      </div>


      <div class="grid gap-2 text-center" id="pad">
        

        <button type="button" class="g-col-6 btn btn-danger fs-4" id="btn-clear">C</button>
        <button type="button" class="g-col-3 btn btn-secondary fs-4" id="btn-del">DEL</button>
        <button type="button" class="g-col-3 btn btn-warning fs-4 op-btn" data-op="/">/</button>


        <button type="button" class="g-col-3 btn btn-primary fs-4 num-btn" data-num="7">7</button>
        <button type="button" class="g-col-3 btn btn-primary fs-4 num-btn" data-num="8">8</button>
        <button type="button" class="g-col-3 btn btn-primary fs-4 num-btn" data-num="9">9</button>
        <button type="button" class="g-col-3 btn btn-warning fs-4 op-btn" data-op="*">x</button>


        <button type="button" class="g-col-3 btn btn-primary fs-4 num-btn" data-num="4">4</button>
        <button type="button" class="g-col-3 btn btn-primary fs-4 num-btn" data-num="5">5</button>
        <button type="button" class="g-col-3 btn btn-primary fs-4 num-btn" data-num="6">6</button>
        <button type="button" class="g-col-3 btn btn-warning fs-4 op-btn" data-op="-">-</button>

        <button type="button" class="g-col-3 btn btn-primary fs-4 num-btn" data-num="1">1</button>
        <button type="button" class="g-col-3 btn btn-primary fs-4 num-btn" data-num="2">2</button>
        <button type="button" class="g-col-3 btn btn-primary fs-4 num-btn" data-num="3">3</button>
        <button type="button" class="g-col-3 btn btn-warning fs-4 op-btn" data-op="+">+</button>

        <button type="button" class="g-col-6 btn btn-primary fs-4 num-btn" data-num="0">0</button>
        <button type="button" class="g-col-3 btn btn-primary fs-4 num-btn" data-num=".">.</button>
        <button type="button" class="g-col-3 btn btn-success fs-4" id="btn-equals">=</button>

      </div>
    </div>
    
  </div>

  <script type="module" src="js/mycalc.js"></script>
</body>
</html>
