<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Nilai</title>
</head>
<body>
  <h1>Kalkulator Nilai</h1>

  <form action="#" id="form">
    <div>
      <label for="tugas">Nilai Tugas: </label>
      <input type="number" name="tugas" id="tugas" min="0" max="100" required>
    </div>

    <div>
      <label for="uts">Nilai UTS: </label>
      <input type="number" name="uts" id="uts" min="0" max="100" required>
    </div>

    <div>
      <label for="uas">Nilai UAS: </label>
      <input type="number" name="uas" id="uas" min="0" max="100" required>
    </div>

    <button type="submit">Hitung</button>
  </form>

  <p id="result"></p>

  <script type="module" src="js/kalkulator.js" defer></script>
</body>
</html>
